name: Mac runner smoke test

on:
  # The optional macOS runner is not part of the dedicated Linux CI pool.
  # Keep this diagnostic opt-in so normal pushes cannot queue indefinitely.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nxrs-mac-runner
  cancel-in-progress: false

jobs:
  runner-smoke-test:
    if: github.actor == 'yongkyuns'
    runs-on: [self-hosted, macOS, X64, EmbeddedRust]
    timeout-minutes: 5
    steps:
      - name: Verify the trusted runner is available
        run: |
          echo "Trusted push by $GITHUB_ACTOR on $GITHUB_REF"
          sw_vers
          uname -m
          git --version
