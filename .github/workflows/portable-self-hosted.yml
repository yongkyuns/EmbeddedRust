name: Portable qualification (trusted self-hosted)

on:
  push:
    branches:
      - 'refactor/**'
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'app/rustcam/**'
      - 'hal/**'
      - 'tests/portable/**'
      - 'tests/native/**'
      - 'tests/host/**'
      - 'tools/check-architecture.py'
      - 'tools/check-deployment.py'
      - '.github/workflows/portable-self-hosted.yml'

permissions:
  contents: read

concurrency:
  group: portable-self-hosted-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    if: github.repository == 'yongkyuns/rustcam' && github.actor == 'yongkyuns'
    runs-on: [self-hosted, Linux, X64, rustcam, nuttx, isolated]
    timeout-minutes: 20
    steps:
      - name: Verify isolated Linux runner
        run: |
          set -eu
          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64
          ! mount | grep -F '/Users/' >/dev/null

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install pinned Rust targets
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs               | sh -s -- -y --profile minimal --default-toolchain none
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup toolchain install 1.90.0 --profile minimal --component clippy
          rustup target add --toolchain 1.90.0 thumbv6m-none-eabi wasm32-unknown-unknown

      - name: Enforce architecture and deployment boundaries
        run: |
          python3 -m unittest discover -s tests/host -p test_architecture.py -v
          python3 -m unittest discover -s tests/host -p test_deployment.py -v
          python3 tools/check-architecture.py
          python3 tools/check-deployment.py \
            --app-manifest app/rustcam/Cargo.toml \
            --hal-feature rustcam-camera/native \
            --hal-feature rustcam-storage/native \
            --hal-feature rustcam-transport/native \
            --execution-platform linux

      - name: Run portable/native qualification
        run: |
          # Exact-head gate for the app -> HAL platform provider-boundary migration.
          cargo +1.90.0 test --locked
          cargo +1.90.0 test --locked -p rustcam-applications \
            --features rustcam-applications/cli,rustcam-camera/native,rustcam-storage/native,rustcam-transport/native \
            --bin rustcam
          cargo +1.90.0 run --locked -p rustcam-simulator --bin rustcam-simulator
          python3 tests/host/test-native-runner.py

      - name: Qualify isolated storage ownership and bytes
        run: |
          python3 -m unittest discover -s tests/host -p test_storage_isolation.py -v
          rm -rf target/storage-isolation
          python3 tools/check-storage-isolation.py

      - name: Compile no-std and wasm profiles
        run: |
          cargo +1.90.0 check --locked -p rustcam-applications --no-default-features --lib --target thumbv6m-none-eabi
          cargo +1.90.0 build --locked --release --lib -p rustcam-simulator --target wasm32-unknown-unknown

      - name: Lint capability APIs, providers and app
        run: |
          cargo +1.90.0 clippy --locked \
            -p rustcam-camera-api -p rustcam-storage-api -p rustcam-transport-api \
            -p rustcam-camera-native -p rustcam-storage-native -p rustcam-transport-native \
            -p rustcam-camera-mock -p rustcam-storage-mock -p rustcam-transport-mock \
            -p rustcam-camera -p rustcam-storage -p rustcam-transport \
            -p rustcam-services -p rustcam-applications \
            --features rustcam-applications/cli,rustcam-camera/native,rustcam-storage/native,rustcam-transport/native --lib --bins -- -D warnings
