name: Transport HAL isolation
on:
  pull_request:
    paths:
      - 'hal/**'
      - 'app/**'
      - 'service/**'
      - 'tools/check-transport-isolation.py'
      - 'tools/check-camera-isolation.py'
      - 'tests/host/test_transport_isolation.py'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/transport-hal.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: transport-hal-${{ github.ref }}
  cancel-in-progress: true
jobs:
  isolation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.90.0
          targets: thumbv6m-none-eabi,wasm32-unknown-unknown
          components: clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reject invalid build evidence and received datagrams
        run: |
          python tools/check-camera-isolation.py --self-test
          python -m unittest discover -s tests/host -p test_transport_isolation.py -v
      - name: Build independent transport and an aggregate-free native app
        run: python tools/check-transport-isolation.py
      - name: Check socket ownership, rejection and app startup allocation
        run: |
          cargo test --locked -p nxrs-transport-native -p nxrs-transport-mock
          cargo test --locked -p nxrs-applications --features nxrs-applications/cli,nxrs-camera/native,nxrs-storage/native,nxrs-transport/native --bin nxrs
      - name: Lint independent transport packages
        run: cargo clippy --locked -p nxrs-transport-api -p nxrs-transport-native -p nxrs-transport-mock --all-targets -- -D warnings
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: transport-hal-isolation
          path: target/transport-isolation
