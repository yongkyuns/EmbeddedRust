name: PX4 reference rendering (temporary)
on:
  push:
    branches: [docs/px4-reference-render-20261002]
    paths:
      - 'docs/references/px4/diagrams/**'
      - '.github/workflows/px4-reference-render-once.yml'
permissions:
  contents: read
jobs:
  render:
    if: github.repository == 'yongkyuns/nxrs' && github.ref == 'refs/heads/docs/px4-reference-render-20261002'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install checksum-verified D2 v0.9.0
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/px4-d2"
          curl --fail --location --retry 2 https://github.com/d2lang/d2/releases/download/v0.9.0/d2-v0.9.0-linux-amd64.tar.gz -o "$RUNNER_TEMP/d2-v0.9.0-linux-amd64.tar.gz"
          echo "5669ddc46b99e942cc96078f4a4e36d5e62103348f4c05179ede27802fdd87a9  $RUNNER_TEMP/d2-v0.9.0-linux-amd64.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/d2-v0.9.0-linux-amd64.tar.gz" -C "$RUNNER_TEMP/px4-d2"
          binary="$(find "$RUNNER_TEMP/px4-d2" -type f -name d2 -print -quit)"
          test -n "$binary"
          echo "$(dirname "$binary")" >> "$GITHUB_PATH"
          "$binary" --version
      - uses: actions/upload-artifact@v4
        with:
          name: px4-d2-toolchain
          path: ${{ runner.temp }}/d2-v0.9.0-linux-amd64.tar.gz
          retention-days: 1
      - name: Render and validate diagrams
        shell: bash
        run: |
          set -euo pipefail
          bash -n docs/references/px4/diagrams/render.sh
          bash docs/references/px4/diagrams/render.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: px4-reference-diagrams
          path: docs/references/px4/diagrams/
