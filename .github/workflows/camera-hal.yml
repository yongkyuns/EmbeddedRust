name: Camera HAL isolation
on:
  pull_request:
    paths:
      - 'hal/**'
      - 'app/**'
      - 'service/**'
      - 'tools/check-camera-isolation.py'
      - 'tools/check-architecture.py'
      - 'tests/host/test_architecture.py'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/camera-hal.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: camera-hal-${{ github.ref }}
  cancel-in-progress: true
jobs:
  isolation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.90.0
          targets: thumbv6m-none-eabi,wasm32-unknown-unknown
          components: clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate build-evidence rejection controls
        run: python tools/check-camera-isolation.py --self-test
      - name: Clean camera-only builds and explicit unsupported-target rejection
        run: python tools/check-camera-isolation.py
      - name: Independent provider contract tests
        run: cargo test --locked -p rustcam-camera-native -p rustcam-camera-mock
      - name: Lint independent portable and native packages
        run: cargo clippy --locked -p rustcam-hal-common -p rustcam-camera-api -p rustcam-camera-native -p rustcam-camera-mock --all-targets -- -D warnings
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: camera-hal-isolation
          path: target/camera-isolation
