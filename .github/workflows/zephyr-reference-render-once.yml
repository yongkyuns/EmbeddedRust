name: Zephyr reference rendering (temporary)
on:
  push:
    branches: [docs/zephyr-reference-render]
    paths:
      - docs/references/zephyr/diagrams/*.d2
      - docs/references/zephyr/diagrams/render.sh
      - .github/workflows/zephyr-reference-render-once.yml
permissions:
  contents: read
jobs:
  render:
    if: github.repository == 'yongkyuns/EmbeddedRust' && github.ref == 'refs/heads/docs/zephyr-reference-render'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/zephyr-reference-render
      - name: Install verified D2 v0.9.0
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/zephyr-d2"
          curl --fail --location --retry 2 https://github.com/d2lang/d2/releases/download/v0.9.0/d2-v0.9.0-linux-amd64.tar.gz -o "$RUNNER_TEMP/zephyr-d2.tar.gz"
          echo "5669ddc46b99e942cc96078f4a4e36d5e62103348f4c05179ede27802fdd87a9  $RUNNER_TEMP/zephyr-d2.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/zephyr-d2.tar.gz" -C "$RUNNER_TEMP/zephyr-d2"
          binary="$(find "$RUNNER_TEMP/zephyr-d2" -type f -name d2 -print -quit)"
          test -n "$binary"
          echo "$(dirname "$binary")" >> "$GITHUB_PATH"
          "$binary" --version
      - name: Render and match locally inspected SVGs
        shell: bash
        run: |
          set -euo pipefail
          bash -n docs/references/zephyr/diagrams/render.sh
          bash docs/references/zephyr/diagrams/render.sh
          python3 - <<'PY'
          import hashlib
          import xml.etree.ElementTree as ET
          from pathlib import Path
          expected = {
              'zephyr-abstractions': '206b5802798eb4797d61d3d062749140ea3fb7b5',
              'zephyr-build-selection': '80ab125cb76e5f2d3d6012a15759bf5912ca9007',
              'nxrs-direction': '15bf9448ab6f3a1f802a9aea7e94e952fea118ef',
          }
          for name, expected_hash in expected.items():
              p = Path('docs/references/zephyr/diagrams') / (name + '.svg')
              content = p.read_bytes()
              root = ET.fromstring(content)
              assert root.tag == '{http://www.w3.org/2000/svg}svg', p
              _, _, width, height = map(float, root.attrib['viewBox'].split())
              assert width > height and height * 800 / width < 320, (p, width, height)
              actual = hashlib.sha1(f'blob {len(content)}\0'.encode() + content).hexdigest()
              assert actual == expected_hash, (p, actual, expected_hash)
              print(f'{p}: {width:g}x{height:g}; verified inspected blob {actual}')
          PY
      - name: Commit only generated SVGs to the temporary branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/docs/zephyr-reference-render
          git add -- docs/references/zephyr/diagrams/zephyr-abstractions.svg docs/references/zephyr/diagrams/zephyr-build-selection.svg docs/references/zephyr/diagrams/nxrs-direction.svg
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: render verified landscape Zephyr reference diagrams'
          git push origin HEAD:refs/heads/docs/zephyr-reference-render
