[package]
name = "rustcam-std-demo"
version.workspace = true
edition.workspace = true

[package.metadata.rustcam.firmware]
bin = "std-demo"
command = "std_demo"
priority = 100
stack-size = 65536

[features]
# Only enables ignored diagnostic tests; normal binaries are not instrumented.
memory-probe = []

[dev-dependencies]
rustcam-allocation-probe = { path = "../../tests/allocation-probe" }

[[bin]]
name = "std-demo"
path = "src/main.rs"
