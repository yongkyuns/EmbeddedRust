[package]
name = "rustcam-ao-stress"
version.workspace = true
edition.workspace = true

[package.metadata.rustcam.firmware]
bin = "ao-stress"
command = "ao_stress"
priority = 100
stack-size = 65536

[features]
# Only enables ignored diagnostic tests; normal binaries are not instrumented.
memory-probe = []

[dependencies]
rustcam-service-event = { path = "../../service/event" }

[dev-dependencies]
rustcam-allocation-probe = { path = "../../tests/allocation-probe" }

[[bin]]
name = "ao-stress"
path = "src/main.rs"
